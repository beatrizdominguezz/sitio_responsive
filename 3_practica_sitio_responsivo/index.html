<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="author" content="Beatriz Dominguez">
    <link rel="stylesheet" href="static/css/style.css">
</head>
    <body>
        <header>
            <nav class="navbar">
                <div class="barra_principal">
                    <div class="row_navbar">
                        <img src="static/images/youtube.jpg" alt="icono" class="icono_youtube">
                        <div class="row_titulo">
                            <h1 class="letra_bold_titulo">Video</h1>
                            <h1 class="letra_roja_titulo">Stream</h1>
                        </div>
                        <div class="lista_navbar">
                            <a href="#">Inicio</a>
                            <a href="#">Explorar</a>
                            <a href="#">Mi lista</a>
                        </div>
                    </div>
                    <div class="barra_principal2">
                        <div class="buscador_navbar">
                            <input type="text" class="buscador" placeholder="🔍">
                        </div>
                        <div class="notificacion_perfil">
                            <img src="" alt="notificaciones" class="iconos_navbar">
                            <img src="" alt="perfil" class="iconos_navbar">
                        </div>
                    </div>
                    
                </div>
            </nav>
        </header>
        <section class="seccion-principal">

            <div class="contenedor_2">
                <div class="texto-banner">
                    <video src="static/video/paisajes.mp4" controls width="640" height="360"></video>
                </div>
            </div> 

            
            <section class="recomendados">
                <div class="row_cola1">
                    <h3>Siguiente en la cola</h3>
                    <button class="btn_limpiar">Limpiar cola</button>
                </div>
                <div class="tarjeta-recomendado">
                    <img src="static/images/libro2.jpg" alt="Cien años de soledad">
                    <div class="column_recomendado1">
                        <div class="column_recomendado2">
                            <p class="letra_negrita">Cien años de soledad</p>
                            <p class="letra_gris">Gabriel García Márquez</p>
                        </div>
                        <div class="row_recomendado">
                            <a href="#">Ver más...</a>
                            <button class="btn-sumar">+</button>
                        </div>
                    </div>
                </div>

                <div class="tarjeta-recomendado">
                    <img src="static/images/libro1.jpg" alt="Sapiens">
                    <div class="column_recomendado1">
                        <div class="column_recomendado2">
                            <p class="letra_negrita">Sapiens</p>
                            <p class="letra_gris">Yuval Noah Harari</p>
                        </div>
                        <div class="row_recomendado">
                            <a href="#">Ver más...</a>
                            <button class="btn-sumar">+</button>
                        </div>
                    </div>
                </div>

                <div class="tarjeta-recomendado">
                    <img src="static/images/elPrincipito.jpg" alt="El principito">
                    <div class="column_recomendado1">
                        <div class="column_recomendado2">
                            <p class="letra_negrita">El principito</p>
                            <p class="letra_gris">Antoine de Saint-Exupéry</p>
                        </div>
                        <div class="row_recomendado">
                            <a href="#">Ver más...</a>
                            <button class="btn-sumar">+</button>
                        </div>
                    </div>
                </div>
            </section>

        </section>
    </main>
    <script src="static/js/script.js"></script>
    </body>
</html>
